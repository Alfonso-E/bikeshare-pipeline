name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests -q

      # The collector runs against the live feed on every push. Slower than
      # mocking, but it is the only thing that catches the failure that
      # actually happens: an operator quietly changing their feed shape.
      - name: Ingest one snapshot
        run: python scripts/run_ingest.py --system nyc

      - name: Collector integrity
        run: python scripts/run_quality.py
