name: ingest

# Scheduled collection. This is what makes the project a pipeline rather than
# a notebook: it runs whether or not anyone is watching, and the dataset grows.
#
# GitHub schedules are best-effort -- routinely delayed several minutes under
# load, and paused entirely on repos idle for 60 days. Neither corrupts
# anything; a missed run is a gap in the series, so check coverage before
# trusting any time-of-day analysis.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Never let two runs write the lake and push at the same time.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest
        run: python scripts/run_ingest.py

      - name: Collector integrity
        run: python scripts/run_quality.py

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # data/raw is gitignored so local experiments stay out of the repo.
          # The scheduled job is the one writer allowed to persist it, hence -f.
          #
          # Size budget: ~30 kB per snapshot, one system, 48 snapshots a day is
          # roughly 0.5 GB a year. Fine for a portfolio repo, not fine forever.
          # When it stops being fine, point RAW_DIR at object storage -- reads
          # are a glob either way.
          git add -f data/raw data/quality/latest.json
          if git diff --staged --quiet; then
            echo "no new snapshots; feed had not ticked"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
