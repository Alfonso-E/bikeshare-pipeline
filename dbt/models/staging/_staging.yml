version: 2

models:
  - name: stg_station_status
    description: Cleaned, deduplicated availability snapshots.
    tests:
      - unique_combination:
          arguments:
            columns: ["system_key", "station_id", "feed_updated_at"]
    columns:
      - name: station_id
        tests: [not_null]
      - name: snapshot_ts
        tests: [not_null]
      - name: bikes_available
        tests: [not_null]

  - name: stg_station_information
    description: Latest metadata snapshot per station.
    columns:
      - name: station_id
        tests: [not_null]
      - name: station_name
        tests: [not_null]
