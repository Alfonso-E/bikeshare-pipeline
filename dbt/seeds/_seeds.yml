version: 2

seeds:
  - name: system_timezones
    description: >
      Maps each GBFS system to its local timezone. Needed because snapshots are
      stored in UTC, but "hour of day" only means anything in the rider's local
      time -- and extracting it from a UTC timestamp silently yields whatever
      timezone the machine running dbt happens to be in.
    config:
      column_types:
        system_key: varchar
        system_name: varchar
        timezone: varchar
    columns:
      - name: system_key
        tests: [unique, not_null]
      - name: timezone
        tests: [not_null]
